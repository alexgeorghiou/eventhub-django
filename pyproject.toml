[project]
name = "eventhub"
version = "0.1.0"
description = "Conference and event ticketing built on Django 4.2 LTS and Django REST Framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Georghiou" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["config", "events", "ticketing", "checkin"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: tests that require a real PostgreSQL database"]
filterwarnings = [
  "ignore::DeprecationWarning:celery.*",
  "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["config", "events", "ticketing", "checkin"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
